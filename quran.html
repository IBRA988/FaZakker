<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>فَذَكِّرْ | القرآن الكريم</title>

  <!-- PWA Manifest -->
  <link rel="manifest" href="./manifest.json" />

  <!-- Favicon -->
  <link rel="icon" type="image/x-icon" href="./assets/images/favicon/favicon.ico" />
  <link rel="apple-touch-icon" href="./assets/images/favicon/apple-touch-icon.png" />

  <!-- Fonts & Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

  <!-- Stylesheets -->
  <link rel="stylesheet" href="./assets/css/main.css" />
  <link rel="stylesheet" href="./assets/css/quran.css" />

  <!-- Axios CDN -->
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
</head>
<body>

  <div class="app-container">

    <!-- Desktop Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <img src="./assets/images/favicon/android-chrome-512x512.png" alt="شعار فَذَكِّرْ" />
        <div class="sidebar-title">
          <h1>فَذَكِّرْ</h1>
          <span>المصحف الإلكتروني</span>
        </div>
      </div>

      <ul class="nav-links">
        <li class="nav-item">
          <a href="prayers.html">
            <i class="fa-solid fa-clock"></i>
            <span>مواقيت الصلاة</span>
          </a>
        </li>
        <li class="nav-item active">
          <a href="quran.html">
            <i class="fa-solid fa-book-quran"></i>
            <span>القرآن الكريم</span>
          </a>
        </li>
        <li class="nav-item">
          <a href="azkar.html">
            <i class="fa-solid fa-book-open"></i>
            <span>الأذكار والمسبحة</span>
          </a>
        </li>
      </ul>

      <div class="sidebar-footer">
        <div class="sidebar-badge">
          <i class="fa-solid fa-feather"></i>
          <span>قراءة بدقة عالية متجاوبة</span>
        </div>
      </div>
    </aside>

    <!-- Mobile Bottom Navigation Bar -->
    <nav class="mobile-nav">
      <a href="prayers.html" class="mobile-nav-item">
        <i class="fa-solid fa-clock"></i>
        <span>المواقيت</span>
      </a>
      <a href="quran.html" class="mobile-nav-item active">
        <i class="fa-solid fa-book-quran"></i>
        <span>القرآن</span>
      </a>
      <a href="azkar.html" class="mobile-nav-item">
        <i class="fa-solid fa-book-open"></i>
        <span>الأذكار</span>
      </a>
    </nav>

    <!-- Main Content Area -->
    <main class="main-content">

      <!-- Header Banner -->
      <header class="page-header">
        <div class="header-title">
          <h2><i class="fa-solid fa-book-quran" style="color:var(--gold-light);"></i> القرآن الكريم - المصحف الشريف</h2>
          <p>تصفح وتلاوة آيات القرآن الكريم بالرسم العثماني الشريف مع الاستماع لأشهر القراء</p>
        </div>

        <div class="header-actions">
          <button class="btn btn-secondary btn-icon btn-sidebar-toggle" title="طَي / توسيع القائمة الجانبية">
            <i class="fa-solid fa-bars-staggered"></i>
          </button>

          <button class="btn btn-secondary btn-icon btn-theme-toggle" title="التبديل بين الوضع الداكن والفاتح">
            <i class="fa-solid fa-sun"></i>
          </button>
        </div>
      </header>

      <!-- Quran Toolbar -->
      <section class="quran-toolbar">
        <div class="toolbar-group">
          <div class="toolbar-item">
            <label for="surahSelect"><i class="fa-solid fa-book-bookmark"></i> السورة:</label>
            <select id="surahSelect" class="form-control"></select>
          </div>

          <div class="toolbar-item">
            <label for="pageInput"><i class="fa-solid fa-hashtag"></i> الصفحة (1-604):</label>
            <input type="number" id="pageInput" class="form-control" min="1" max="604" value="1" style="width: 90px; text-align: center;" />
          </div>
        </div>

        <div class="toolbar-group">
          <button id="btnBookmarkPage" class="btn btn-gold" title="حفظ علامة مرجعية عند هذه الصفحة">
            <i class="fa-solid fa-bookmark"></i>
            <span>حفظ العلامة</span>
          </button>

          <div style="display: flex; gap: 4px; background: var(--input-bg); padding: 4px; border-radius: var(--radius-md); border: 1px solid var(--glass-border);">
            <button id="btnZoomIn" class="btn btn-secondary btn-icon" title="تكبير الصفحة"><i class="fa-solid fa-magnifying-glass-plus"></i></button>
            <button id="btnZoomOut" class="btn btn-secondary btn-icon" title="تصغير الصفحة"><i class="fa-solid fa-magnifying-glass-minus"></i></button>
            <button id="btnZoomReset" class="btn btn-secondary btn-icon" title="إعادة الحجم الأصلي"><i class="fa-solid fa-rotate-left"></i></button>
          </div>
        </div>
      </section>

      <!-- Audio Reciter Bar -->
      <section class="quran-audio-bar">
        <div class="audio-controls">
          <button id="btnPlayAudio" class="audio-btn-play" title="تشغيل التلاوة الصوتية">
            <i class="fa-solid fa-play"></i>
          </button>
          <div class="audio-info">
            <span class="reciter-name">التلاوة الصوتية للسورة</span>
            <span class="surah-title" id="audioSurahName">سورة الفاتحة</span>
          </div>
        </div>

        <div class="toolbar-item">
          <label for="reciterSelect"><i class="fa-solid fa-microphone-lines"></i> القارئ:</label>
          <select id="reciterSelect" class="form-control" style="min-width: 200px;"></select>
        </div>
      </section>

      <!-- Floating Page Nav Buttons -->
      <button id="btnPrevPage" class="page-nav-btn prev-page" title="الصفحة السابقة (السهم الأيمن)">
        <i class="fa-solid fa-arrow-right"></i>
      </button>
      <button id="btnNextPage" class="page-nav-btn next-page" title="الصفحة التالية (السهم الأيسر)">
        <i class="fa-solid fa-arrow-left"></i>
      </button>

      <!-- SVG Quran Page Container -->
      <section class="quran-container">
        <div id="quranPaper" class="quran-paper">
          <div class="loader-spinner"></div>
        </div>

        <!-- Bottom Page Controls Bar -->
        <div class="quran-bottom-bar">
          <button id="btnBottomPrevPage" class="btn btn-secondary">
            <i class="fa-solid fa-arrow-right"></i>
            <span>الصفحة السابقة</span>
          </button>

          <span class="page-num-badge" id="bottomPageBadge">صفحة 1 من 604</span>

          <button id="btnBottomNextPage" class="btn btn-secondary">
            <span>الصفحة التالية</span>
            <i class="fa-solid fa-arrow-left"></i>
          </button>
        </div>
      </section>

    </main>
  </div>

  <!-- Scripts -->
  <script src="./assets/js/common.js"></script>
  <script src="./assets/js/quran.js"></script>
</body>
</html>
